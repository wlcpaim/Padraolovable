<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WLC.IA OMNICHANNEL | ERP & Vendas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              background: '#090d16',
              surface: '#111827',
              'surface-hover': '#1f2937',
              border: '#1e293b',
              text: '#f8fafc',
              muted: '#94a3b8',
              primary: '#00ffcc',
              'primary-hover': '#00cca3',
              accent: '#10b981',
              danger: '#ef4444',
              warning: '#f59e0b'
            }
          }
        }
      }
    </script>
</head>
<body class="h-full bg-background text-text font-sans antialiased">
    <div id="app" class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside id="sidebar" class="w-64 bg-surface border-r border-border flex flex-col z-20">
            <div class="p-5 border-b border-border flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 rounded-lg bg-primary/10 border border-primary/30 flex items-center justify-center text-primary font-bold">W</div>
                    <div>
                        <h1 class="font-bold text-sm tracking-wide text-text">WLC.IA OMNI</h1>
                        <p class="text-xs text-emerald-400 font-mono flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> Enterprise v1.0</p>
                    </div>
                </div>
            </div>
            <nav id="nav-links" class="flex-1 p-4 space-y-1.5 overflow-y-auto"></nav>
            <div class="p-4 border-t border-border">
                <div class="bg-surface-hover/50 p-3 rounded-xl border border-border/50 text-xs text-muted">
                    <p class="font-medium text-text">Base Integrada WLC.DB</p>
                    <p class="mt-0.5 text-[11px] text-emerald-400">Online • Sincronizado</p>
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 flex flex-col min-w-0 overflow-hidden">
            <header class="h-16 bg-surface/80 backdrop-blur border-b border-border px-6 flex items-center justify-between z-10">
                <div class="flex items-center gap-4">
                    <h2 id="view-title" class="text-lg font-semibold text-text">Dashboard Executivo</h2>
                </div>
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 rounded-full bg-primary/20 border border-primary/40 flex items-center justify-center text-primary font-bold text-xs">AD</div>
                </div>
            </header>
            
            <div id="view-container" class="flex-1 overflow-y-auto p-6 bg-background"></div>
        </main>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
